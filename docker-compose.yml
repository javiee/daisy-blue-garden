version: '3.8'

# NOTE: using the external MySQL server defined in .env (DATABASE_URL).
# The local `db` service below is kept commented out for reference.
# services:
#   db:
#     image: mysql:8.0
#     environment:
#       MYSQL_DATABASE: daisyblue
#       MYSQL_USER: daisyblue
#       MYSQL_PASSWORD: daisyblue_pass
#       MYSQL_ROOT_PASSWORD: root_pass
#     volumes:
#       - mysql_data:/var/lib/mysql
#     ports:
#       - "3306:3306"
#     healthcheck:
#       test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
#       timeout: 20s
#       retries: 10

services:
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    env_file: .env
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
  qcluster:
    build: ./backend
    command: python manage.py qcluster
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    env_file: .env
    depends_on:
      backend:
        condition: service_started

volumes:
  # mysql_data:   # only needed if the local `db` service is re-enabled
  media_files:
